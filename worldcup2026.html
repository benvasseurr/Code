<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 — Family Predictions</title>
<style>
  :root {
    --green-dark: #0d2b1a;
    --green-main: #1a472a;
    --green-mid: #2d6a4f;
    --green-light: #40916c;
    --gold: #ffd700;
    --gold-dark: #e6b800;
    --white: #f8f9fa;
    --gray-light: #e9ecef;
    --gray-mid: #adb5bd;
    --gray-dark: #495057;
    --text: #f0f0f0;
    --card-bg: rgba(255,255,255,0.07);
    --card-border: rgba(255,255,255,0.12);
    --input-bg: rgba(0,0,0,0.3);
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
    --radius: 12px;
    --radius-sm: 8px;
    --transition: 0.2s ease;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, var(--green-dark) 0%, var(--green-main) 50%, #0a3d1f 100%);
    min-height: 100vh;
    color: var(--text);
    font-size: 15px;
    line-height: 1.5;
  }

  /* ── Header ── */
  .site-header {
    background: rgba(0,0,0,0.45);
    border-bottom: 2px solid var(--gold);
    padding: 18px 20px 14px;
    text-align: center;
    backdrop-filter: blur(8px);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .site-header h1 {
    font-size: clamp(1.3rem, 4vw, 2rem);
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--gold);
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  .site-header h1 span { color: var(--white); }
  .site-header .subtitle {
    font-size: 0.78rem;
    color: var(--gray-mid);
    margin-top: 2px;
  }

  /* ── Warning banner ── */
  .warning-banner {
    background: rgba(255, 200, 0, 0.12);
    border: 1px solid rgba(255,215,0,0.3);
    color: #ffe066;
    text-align: center;
    padding: 8px 16px;
    font-size: 0.78rem;
  }

  /* ── Tab nav ── */
  .tab-nav {
    display: flex;
    justify-content: center;
    gap: 4px;
    padding: 16px 16px 0;
    background: rgba(0,0,0,0.2);
  }
  .tab-btn {
    background: transparent;
    border: 2px solid transparent;
    color: var(--gray-mid);
    padding: 9px 22px;
    border-radius: var(--radius-sm) var(--radius-sm) 0 0;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition);
    letter-spacing: 0.3px;
  }
  .tab-btn:hover { color: var(--white); background: rgba(255,255,255,0.06); }
  .tab-btn.active {
    background: var(--card-bg);
    border-color: var(--card-border);
    border-bottom-color: transparent;
    color: var(--gold);
  }

  /* ── Main content ── */
  .main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px 14px 60px;
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── Cards ── */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    backdrop-filter: blur(6px);
  }

  /* ── Leaderboard ── */
  .leaderboard-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .leaderboard-header h2 {
    font-size: 1.4rem;
    color: var(--gold);
    font-weight: 800;
  }
  .trophy-icon { font-size: 1.6rem; }

  .lb-table {
    width: 100%;
    border-collapse: collapse;
  }
  .lb-table thead th {
    text-align: left;
    padding: 10px 12px;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--gray-mid);
    border-bottom: 1px solid var(--card-border);
  }
  .lb-table thead th.num { text-align: center; }
  .lb-table tbody tr {
    transition: background var(--transition);
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .lb-table tbody tr:last-child { border-bottom: none; }
  .lb-table tbody tr:hover { background: rgba(255,255,255,0.05); }
  .lb-table tbody td { padding: 12px 12px; vertical-align: middle; }
  .lb-table tbody td.num { text-align: center; }

  .rank-cell { display: flex; align-items: center; gap: 8px; }
  .rank-num {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--gray-mid);
    min-width: 20px;
  }
  .medal { font-size: 1.3rem; }
  .player-name-lb { font-weight: 700; font-size: 1rem; }
  .pts-badge {
    display: inline-block;
    background: var(--gold);
    color: #000;
    font-weight: 800;
    font-size: 0.95rem;
    border-radius: 20px;
    padding: 2px 12px;
    min-width: 44px;
    text-align: center;
  }
  .lb-sub { font-size: 0.78rem; color: var(--gray-mid); }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--gray-mid);
    font-size: 0.95rem;
  }
  .empty-state .big { font-size: 2.5rem; margin-bottom: 8px; }

  /* ── Players tab ── */
  .players-section h2 {
    font-size: 1.3rem;
    color: var(--gold);
    font-weight: 800;
    margin-bottom: 16px;
  }

  .add-player-row {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
  }
  .add-player-row input {
    flex: 1;
    background: var(--input-bg);
    border: 1.5px solid var(--card-border);
    border-radius: var(--radius-sm);
    color: var(--white);
    padding: 10px 14px;
    font-size: 0.95rem;
    outline: none;
    transition: border-color var(--transition);
  }
  .add-player-row input:focus { border-color: var(--gold); }
  .add-player-row input::placeholder { color: var(--gray-mid); }

  .btn {
    background: var(--gold);
    color: #000;
    border: none;
    border-radius: var(--radius-sm);
    padding: 10px 20px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: all var(--transition);
    white-space: nowrap;
  }
  .btn:hover { background: var(--gold-dark); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn-danger {
    background: rgba(220,53,69,0.2);
    color: #ff6b7a;
    border: 1px solid rgba(220,53,69,0.3);
  }
  .btn-danger:hover { background: rgba(220,53,69,0.35); color: #fff; transform: none; }
  .btn-sm { padding: 6px 14px; font-size: 0.8rem; }

  .player-list { display: flex; flex-direction: column; gap: 8px; }
  .player-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
  }
  .player-item-name { font-weight: 600; font-size: 1rem; }
  .player-avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--gold);
    color: #000;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800;
    font-size: 0.85rem;
    flex-shrink: 0;
    margin-right: 12px;
  }
  .player-item-left { display: flex; align-items: center; }

  /* ── Matches tab ── */
  .matches-section h2 {
    font-size: 1.3rem;
    color: var(--gold);
    font-weight: 800;
    margin-bottom: 20px;
  }

  .group-block { margin-bottom: 28px; }
  .group-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    cursor: pointer;
    user-select: none;
  }
  .group-badge {
    background: var(--gold);
    color: #000;
    font-weight: 900;
    font-size: 0.85rem;
    border-radius: 6px;
    padding: 4px 12px;
    letter-spacing: 0.5px;
  }
  .group-name {
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--white);
    flex: 1;
  }
  .group-toggle {
    font-size: 0.75rem;
    color: var(--gray-mid);
    transition: transform var(--transition);
  }
  .group-toggle.open { transform: rotate(180deg); }

  .group-matches { display: flex; flex-direction: column; gap: 10px; }
  .group-matches.collapsed { display: none; }

  /* Match card */
  .match-card {
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-sm);
    overflow: hidden;
    transition: box-shadow var(--transition);
  }
  .match-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.5); }

  .match-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: rgba(255,255,255,0.04);
    border-bottom: 1px solid rgba(255,255,255,0.07);
    gap: 8px;
    flex-wrap: wrap;
  }
  .match-teams {
    font-weight: 700;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 0;
  }
  .team-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .vs-text {
    font-size: 0.7rem;
    color: var(--gray-mid);
    font-weight: 600;
    flex-shrink: 0;
  }

  .actual-result-area {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .actual-result-area label {
    font-size: 0.7rem;
    color: var(--gray-mid);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .score-inputs {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .score-input {
    width: 38px;
    height: 34px;
    background: var(--input-bg);
    border: 1.5px solid var(--card-border);
    border-radius: 6px;
    color: var(--white);
    text-align: center;
    font-size: 0.95rem;
    font-weight: 700;
    outline: none;
    transition: border-color var(--transition);
    -moz-appearance: textfield;
  }
  .score-input::-webkit-inner-spin-button,
  .score-input::-webkit-outer-spin-button { -webkit-appearance: none; }
  .score-input:focus { border-color: var(--gold); }
  .score-sep {
    font-weight: 800;
    color: var(--gray-mid);
    font-size: 1rem;
  }
  .actual-result-area .score-input { border-color: rgba(255,215,0,0.4); }
  .actual-result-area .score-input:focus { border-color: var(--gold); }

  .match-predictions {
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .prediction-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .prediction-row:last-child { border-bottom: none; }
  .pred-player-name {
    flex: 1;
    font-size: 0.82rem;
    color: var(--gray-mid);
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pred-score-inputs { display: flex; align-items: center; gap: 3px; }
  .pred-score-inputs .score-input {
    width: 34px;
    height: 30px;
    font-size: 0.85rem;
  }
  .pred-score-inputs .score-sep { font-size: 0.9rem; }
  .pts-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 28px;
    height: 24px;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 800;
    flex-shrink: 0;
  }
  .pts-0 { background: rgba(255,255,255,0.06); color: var(--gray-mid); }
  .pts-1 { background: rgba(52,211,153,0.2); color: #34d399; }
  .pts-3 { background: rgba(255,215,0,0.25); color: var(--gold); }
  .pts-none { background: transparent; color: transparent; width: 28px; }

  .no-players-msg {
    font-size: 0.78rem;
    color: var(--gray-mid);
    font-style: italic;
    padding: 6px 0;
  }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    .tab-btn { padding: 8px 14px; font-size: 0.82rem; }
    .lb-table thead th:nth-child(4),
    .lb-table tbody td:nth-child(4) { display: none; }
    .match-head { gap: 6px; }
    .match-teams { font-size: 0.85rem; }
    .score-input { width: 34px; height: 32px; font-size: 0.88rem; }
    .actual-result-area label { display: none; }
    .btn { padding: 9px 14px; }
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--green-mid); border-radius: 3px; }

  /* ── Animations ── */
  @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .tab-panel.active { animation: fadeIn 0.2s ease; }

  .lb-table tbody tr:nth-child(1) .player-name-lb { color: #ffd700; }
  .lb-table tbody tr:nth-child(2) .player-name-lb { color: #c0c0c0; }
  .lb-table tbody tr:nth-child(3) .player-name-lb { color: #cd7f32; }
</style>
</head>
<body>

<header class="site-header">
  <h1>&#9917; World Cup <span>2026</span> Predictions</h1>
  <div class="subtitle">Family Tracker &middot; Group Stage</div>
</header>
<div class="warning-banner">
  &#9888;&#65039; Match data is approximate &mdash; verify groups at FIFA.com
</div>

<nav class="tab-nav">
  <button class="tab-btn active" data-tab="leaderboard">&#127942; Leaderboard</button>
  <button class="tab-btn" data-tab="matches">&#9917; Matches</button>
  <button class="tab-btn" data-tab="players">&#128101; Players</button>
</nav>

<main class="main">

  <!-- LEADERBOARD -->
  <div class="tab-panel active" id="tab-leaderboard">
    <div class="card">
      <div class="leaderboard-header">
        <span class="trophy-icon">&#127942;</span>
        <h2>Leaderboard</h2>
      </div>
      <div id="leaderboard-content"></div>
    </div>
  </div>

  <!-- MATCHES -->
  <div class="tab-panel" id="tab-matches">
    <div class="matches-section">
      <h2>Group Stage Matches</h2>
      <div id="matches-content"></div>
    </div>
  </div>

  <!-- PLAYERS -->
  <div class="tab-panel" id="tab-players">
    <div class="card players-section">
      <h2>Family Members</h2>
      <div class="add-player-row">
        <input type="text" id="player-name-input" placeholder="Enter name&hellip;" maxlength="30" autocomplete="off">
        <button class="btn" onclick="addPlayer()">Add Player</button>
      </div>
      <div id="player-list-content"></div>
    </div>
  </div>

</main>

<script>
// ─────────────────────────────────────────────────────────────
// DATA
// ─────────────────────────────────────────────────────────────
var GROUPS = [
  { id: 'A', name: 'Group A', teams: ['Argentina', 'Canada', 'Chile', 'Peru'] },
  { id: 'B', name: 'Group B', teams: ['Spain', 'Japan', 'Morocco', 'South Korea'] },
  { id: 'C', name: 'Group C', teams: ['Brazil', 'Germany', 'Colombia', 'Costa Rica'] },
  { id: 'D', name: 'Group D', teams: ['France', 'Uruguay', 'Portugal', 'Ecuador'] },
  { id: 'E', name: 'Group E', teams: ['England', 'USA', 'Mexico', 'Panama'] },
  { id: 'F', name: 'Group F', teams: ['Netherlands', 'Italy', 'Croatia', 'Senegal'] },
  { id: 'G', name: 'Group G', teams: ['Belgium', 'Denmark', 'South Africa', 'Bolivia'] },
  { id: 'H', name: 'Group H', teams: ['Poland', 'Turkey', 'Switzerland', 'DR Congo'] },
  { id: 'I', name: 'Group I', teams: ['Serbia', 'Ukraine', 'Iran', 'Iraq'] },
  { id: 'J', name: 'Group J', teams: ['Egypt', 'Nigeria', 'Cameroon', 'Tunisia'] },
  { id: 'K', name: 'Group K', teams: ['Australia', 'New Zealand', 'Qatar', 'Saudi Arabia'] },
  { id: 'L', name: 'Group L', teams: ['Honduras', 'Jamaica', 'Venezuela', 'Paraguay'] }
];

// Round-robin pairs for 4 teams (indices 0,1,2,3 = A,B,C,D)
var RR_PAIRS = [[0,1],[2,3],[0,2],[1,3],[0,3],[1,2]];

function buildMatches() {
  var matches = [];
  GROUPS.forEach(function(g) {
    RR_PAIRS.forEach(function(pair, idx) {
      matches.push({
        id: g.id + (idx + 1),
        group: g.id,
        groupName: g.name,
        home: g.teams[pair[0]],
        away: g.teams[pair[1]],
        num: idx + 1
      });
    });
  });
  return matches;
}

var ALL_MATCHES = buildMatches();

// ─────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────
var STORAGE_KEY = 'wc2026_tracker';

function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return { players: [], predictions: [], results: {} };
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

var state = loadState();

// ─────────────────────────────────────────────────────────────
// SCORING
// ─────────────────────────────────────────────────────────────
function outcome(h, a) {
  if (h > a) return 'H';
  if (a > h) return 'A';
  return 'D';
}

function calcPoints(predH, predA, realH, realA) {
  if (predH === realH && predA === realA) return 3;
  if (outcome(predH, predA) === outcome(realH, realA)) return 1;
  return 0;
}

function getPrediction(playerId, matchId) {
  for (var i = 0; i < state.predictions.length; i++) {
    var p = state.predictions[i];
    if (p.playerId === playerId && p.matchId === matchId) return p;
  }
  return null;
}

function getResult(matchId) {
  return state.results[matchId] || null;
}

function calcLeaderboard() {
  return state.players.map(function(player) {
    var totalPts = 0, predicted = 0, correctResult = 0, exactScore = 0;
    ALL_MATCHES.forEach(function(m) {
      var pred = getPrediction(player.id, m.id);
      var res = getResult(m.id);
      if (pred !== null) predicted++;
      if (pred !== null && res !== null) {
        var pts = calcPoints(pred.homeGoals, pred.awayGoals, res.homeGoals, res.awayGoals);
        totalPts += pts;
        if (pts >= 1) correctResult++;
        if (pts === 3) exactScore++;
      }
    });
    return { id: player.id, name: player.name, totalPts: totalPts, predicted: predicted, correctResult: correctResult, exactScore: exactScore };
  }).sort(function(a, b) {
    if (b.totalPts !== a.totalPts) return b.totalPts - a.totalPts;
    if (b.exactScore !== a.exactScore) return b.exactScore - a.exactScore;
    return b.correctResult - a.correctResult;
  });
}

// ─────────────────────────────────────────────────────────────
// RENDER: LEADERBOARD
// ─────────────────────────────────────────────────────────────
function renderLeaderboard() {
  var el = document.getElementById('leaderboard-content');
  var lb = calcLeaderboard();
  if (lb.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="big">&#128101;</div>Add players in the Players tab to get started!</div>';
    return;
  }
  var medals = ['🥇', '🥈', '🥉'];
  var rows = lb.map(function(p, i) {
    var medal = i < 3 ? '<span class="medal">' + medals[i] + '</span>' : '';
    return '<tr>' +
      '<td><div class="rank-cell"><span class="rank-num">' + (i+1) + '</span>' + medal +
      '<span class="player-name-lb">' + esc(p.name) + '</span></div></td>' +
      '<td class="num"><span class="pts-badge">' + p.totalPts + '</span></td>' +
      '<td class="num lb-sub">' + p.predicted + '</td>' +
      '<td class="num lb-sub">' + p.correctResult + '</td>' +
      '<td class="num lb-sub">' + p.exactScore + '</td>' +
      '</tr>';
  }).join('');
  el.innerHTML = '<table class="lb-table">' +
    '<thead><tr>' +
    '<th>Player</th>' +
    '<th class="num">Points</th>' +
    '<th class="num">Predicted</th>' +
    '<th class="num">Correct</th>' +
    '<th class="num">Exact</th>' +
    '</tr></thead>' +
    '<tbody>' + rows + '</tbody>' +
    '</table>' +
    '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--card-border);font-size:0.75rem;color:var(--gray-mid);text-align:center;">' +
    'Exact score = <span style="color:var(--gold);font-weight:700;">3 pts</span> &nbsp;&middot;&nbsp; ' +
    'Correct result = <span style="color:#34d399;font-weight:700;">1 pt</span> &nbsp;&middot;&nbsp; ' +
    'Wrong = <span style="color:var(--gray-mid);font-weight:700;">0 pts</span>' +
    '</div>';
}

// ─────────────────────────────────────────────────────────────
// RENDER: MATCHES
// ─────────────────────────────────────────────────────────────
function renderMatches() {
  var el = document.getElementById('matches-content');
  var html = GROUPS.map(function(g) {
    var gMatches = ALL_MATCHES.filter(function(m) { return m.group === g.id; });
    var teamsStr = g.teams.join(' &middot; ');
    var matchCards = gMatches.map(buildMatchCard).join('');
    return '<div class="group-block">' +
      '<div class="group-header" onclick="toggleGroup(\'' + g.id + '\')">' +
      '<span class="group-badge">GROUP ' + g.id + '</span>' +
      '<span class="group-name">' + teamsStr + '</span>' +
      '<span class="group-toggle open" id="toggle-' + g.id + '">▼</span>' +
      '</div>' +
      '<div class="group-matches" id="group-' + g.id + '">' + matchCards + '</div>' +
      '</div>';
  }).join('');
  el.innerHTML = html;
}

function buildMatchCard(m) {
  var res = getResult(m.id);
  var resH = res !== null ? res.homeGoals : '';
  var resA = res !== null ? res.awayGoals : '';

  var actualBlock = '<div class="actual-result-area">' +
    '<label>Result:</label>' +
    '<div class="score-inputs">' +
    '<input type="number" min="0" max="99" class="score-input" id="res-h-' + m.id + '"' +
    ' value="' + resH + '" placeholder="—" onchange="saveResult(\'' + m.id + '\')" oninput="saveResult(\'' + m.id + '\')">' +
    '<span class="score-sep">:</span>' +
    '<input type="number" min="0" max="99" class="score-input" id="res-a-' + m.id + '"' +
    ' value="' + resA + '" placeholder="—" onchange="saveResult(\'' + m.id + '\')" oninput="saveResult(\'' + m.id + '\')">' +
    '</div></div>';

  var predRows = '';
  if (state.players.length === 0) {
    predRows = '<div class="no-players-msg">Add players to enter predictions.</div>';
  } else {
    predRows = state.players.map(function(player) {
      var pred = getPrediction(player.id, m.id);
      var predH = pred !== null ? pred.homeGoals : '';
      var predA = pred !== null ? pred.awayGoals : '';
      var ptsCls = 'pts-none', ptsLbl = '-';
      if (pred !== null && res !== null) {
        var pts = calcPoints(pred.homeGoals, pred.awayGoals, res.homeGoals, res.awayGoals);
        ptsCls = 'pts-' + pts;
        ptsLbl = pts + 'pt';
      }
      return '<div class="prediction-row">' +
        '<span class="pred-player-name" title="' + esc(player.name) + '">' + esc(player.name) + '</span>' +
        '<div class="pred-score-inputs">' +
        '<input type="number" min="0" max="99" class="score-input" id="pred-h-' + player.id + '-' + m.id + '"' +
        ' value="' + predH + '" placeholder="?" onchange="savePred(\'' + player.id + '\',\'' + m.id + '\')" oninput="savePred(\'' + player.id + '\',\'' + m.id + '\')">' +
        '<span class="score-sep">:</span>' +
        '<input type="number" min="0" max="99" class="score-input" id="pred-a-' + player.id + '-' + m.id + '"' +
        ' value="' + predA + '" placeholder="?" onchange="savePred(\'' + player.id + '\',\'' + m.id + '\')" oninput="savePred(\'' + player.id + '\',\'' + m.id + '\')">' +
        '</div>' +
        '<span id="pts-' + player.id + '-' + m.id + '" class="pts-pill ' + ptsCls + '">' + ptsLbl + '</span>' +
        '</div>';
    }).join('');
  }

  return '<div class="match-card" id="match-' + m.id + '">' +
    '<div class="match-head">' +
    '<div class="match-teams">' +
    '<span class="team-name">' + esc(m.home) + '</span>' +
    '<span class="vs-text">vs</span>' +
    '<span class="team-name">' + esc(m.away) + '</span>' +
    '</div>' +
    actualBlock +
    '</div>' +
    '<div class="match-predictions">' + predRows + '</div>' +
    '</div>';
}

// ─────────────────────────────────────────────────────────────
// RENDER: PLAYERS
// ─────────────────────────────────────────────────────────────
function renderPlayers() {
  var el = document.getElementById('player-list-content');
  if (state.players.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="big">&#128101;</div>No players yet. Add someone above!</div>';
    return;
  }
  var items = state.players.map(function(p) {
    var initials = p.name.split(' ').map(function(w){ return w[0]; }).join('').slice(0,2).toUpperCase();
    return '<div class="player-item">' +
      '<div class="player-item-left">' +
      '<div class="player-avatar">' + esc(initials) + '</div>' +
      '<span class="player-item-name">' + esc(p.name) + '</span>' +
      '</div>' +
      '<button class="btn btn-danger btn-sm" onclick="removePlayer(\'' + p.id + '\')">Remove</button>' +
      '</div>';
  }).join('');
  el.innerHTML = '<div class="player-list">' + items + '</div>';
}

// ─────────────────────────────────────────────────────────────
// ACTIONS
// ─────────────────────────────────────────────────────────────
function addPlayer() {
  var input = document.getElementById('player-name-input');
  var name = input.value.trim();
  if (!name) return;
  var lower = name.toLowerCase();
  for (var i = 0; i < state.players.length; i++) {
    if (state.players[i].name.toLowerCase() === lower) {
      alert('A player with that name already exists!');
      return;
    }
  }
  var id = 'p' + Date.now();
  state.players.push({ id: id, name: name });
  saveState();
  input.value = '';
  renderAll();
}

function removePlayer(id) {
  if (!confirm('Remove this player? Their predictions will be deleted.')) return;
  state.players = state.players.filter(function(p) { return p.id !== id; });
  state.predictions = state.predictions.filter(function(p) { return p.playerId !== id; });
  saveState();
  renderAll();
}

function savePred(playerId, matchId) {
  var hEl = document.getElementById('pred-h-' + playerId + '-' + matchId);
  var aEl = document.getElementById('pred-a-' + playerId + '-' + matchId);
  if (!hEl || !aEl) return;
  var hVal = hEl.value.trim();
  var aVal = aEl.value.trim();

  state.predictions = state.predictions.filter(function(p) {
    return !(p.playerId === playerId && p.matchId === matchId);
  });

  if (hVal !== '' && aVal !== '') {
    var h = parseInt(hVal, 10);
    var a = parseInt(aVal, 10);
    if (!isNaN(h) && !isNaN(a) && h >= 0 && a >= 0) {
      state.predictions.push({ playerId: playerId, matchId: matchId, homeGoals: h, awayGoals: a });
    }
  }
  saveState();
  updatePtsPills(matchId);
  if (document.getElementById('tab-leaderboard').classList.contains('active')) {
    renderLeaderboard();
  }
}

function saveResult(matchId) {
  var hEl = document.getElementById('res-h-' + matchId);
  var aEl = document.getElementById('res-a-' + matchId);
  if (!hEl || !aEl) return;
  var hVal = hEl.value.trim();
  var aVal = aEl.value.trim();

  if (hVal !== '' && aVal !== '') {
    var h = parseInt(hVal, 10);
    var a = parseInt(aVal, 10);
    if (!isNaN(h) && !isNaN(a) && h >= 0 && a >= 0) {
      state.results[matchId] = { homeGoals: h, awayGoals: a };
    } else {
      delete state.results[matchId];
    }
  } else {
    delete state.results[matchId];
  }
  saveState();
  updatePtsPills(matchId);
  if (document.getElementById('tab-leaderboard').classList.contains('active')) {
    renderLeaderboard();
  }
}

function updatePtsPills(matchId) {
  var res = getResult(matchId);
  state.players.forEach(function(player) {
    var pred = getPrediction(player.id, matchId);
    var pillEl = document.getElementById('pts-' + player.id + '-' + matchId);
    if (!pillEl) return;
    if (pred !== null && res !== null) {
      var pts = calcPoints(pred.homeGoals, pred.awayGoals, res.homeGoals, res.awayGoals);
      pillEl.className = 'pts-pill pts-' + pts;
      pillEl.textContent = pts + 'pt';
    } else {
      pillEl.className = 'pts-pill pts-none';
      pillEl.textContent = '-';
    }
  });
}

function toggleGroup(groupId) {
  var el = document.getElementById('group-' + groupId);
  var tog = document.getElementById('toggle-' + groupId);
  if (el.classList.contains('collapsed')) {
    el.classList.remove('collapsed');
    tog.classList.add('open');
  } else {
    el.classList.add('collapsed');
    tog.classList.remove('open');
  }
}

// ─────────────────────────────────────────────────────────────
// TABS
// ─────────────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    var tab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
    document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
    btn.classList.add('active');
    document.getElementById('tab-' + tab).classList.add('active');
    if (tab === 'leaderboard') renderLeaderboard();
    if (tab === 'matches') renderMatches();
    if (tab === 'players') renderPlayers();
  });
});

// ─────────────────────────────────────────────────────────────
// ENTER KEY
// ─────────────────────────────────────────────────────────────
document.getElementById('player-name-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') addPlayer();
});

// ─────────────────────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────────────────────
function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function renderAll() {
  renderLeaderboard();
  if (document.getElementById('tab-matches').classList.contains('active')) {
    renderMatches();
  }
  renderPlayers();
}

// ─────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────
renderLeaderboard();
renderPlayers();
</script>
</body>
</html>
